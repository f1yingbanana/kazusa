# Pushing a version tag (`v0.2.0` or `0.2.0`) publishes both installers, and the
# archives Settings → Updates installs from. Every push to `main` replaces the
# `head` prerelease with archives of it, for "Development" updates. Running it
# by hand from the Actions tab builds and checks them without publishing.
name: Release

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
    branches: [main]
  workflow_dispatch:

# Only the newest `main` matters; a release always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    # A Mac builds both: only it can make a disk image, and it can cross-install
    # Windows. The bundled Node is whichever version runs the build.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      # A tag's name, else `git describe` (`0.1.3-2-gef08f9b`), which
      # `scripts/update.mjs` reads the commit back out of.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"
          else version="$(git describe --tags --always --abbrev=7 --match '[0-9]*' --match 'v[0-9]*')"; fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - run: brew install makensis
      - run: node scripts/package.mjs darwin-arm64 "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/package.mjs win-x64 "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: |
            dist/Kazusa-*.dmg
            dist/Kazusa-Setup-*.exe
            dist/Kazusa-*.tar.gz
          compression-level: 0

  verify-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: installers
      - shell: pwsh
        run: |
          $installer = (Get-ChildItem installers/Kazusa-Setup-*.exe).FullName
          ./scripts/verify-installer.ps1 -Installer $installer

  publish:
    needs: verify-windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: installers
      # A release made on GitHub's page creates the tag that starts this run, so
      # it can already exist: then the installers go onto it, its notes kept.
      - run: |
          installers=(installers/Kazusa-*.dmg installers/Kazusa-Setup-*.exe installers/Kazusa-*.tar.gz)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${installers[@]}" --clobber
          else
            gh release create "$TAG" "${installers[@]}" \
              --verify-tag --generate-notes --notes "These builds are unsigned.
          **Windows:** choose More info, then Run anyway. To update, use Settings > Updates, or run the new installer and keep the same folder.
          **Mac (Apple silicon):** drag Kazusa to Applications and open it. If macOS blocks it, go to System Settings > Privacy & Security and choose Open Anyway. To update, use Settings > Updates, or replace the app.
          To quit, press Ctrl+C in Kazusa's terminal window and wait for it to finish."
          fi

  # One `head` prerelease at a time, so `releases/latest` never sees it.
  publish-head:
    needs: [build, verify-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: installers
      - run: |
          gh release delete head --yes --cleanup-tag || true
          gh release create head installers/Kazusa-*.tar.gz \
            --prerelease --latest=false --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "The latest build of main, for Settings > Updates > Development. Not a release: it may be broken."
